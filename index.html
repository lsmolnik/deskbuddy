<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Desk Buddy</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #121212; color: #eee; }
  main { max-width: 420px; margin: 0 auto; padding: 40px 20px; text-align: center; }
  h1 { font-size: 24px; }
  p { color: #b3b3b3; line-height: 1.5; }
  .btn { display: inline-block; margin-top: 16px; padding: 14px 28px; border-radius: 999px;
         background: #1db954; color: #000; font-weight: 700; text-decoration: none; }
  [hidden] { display: none; }
</style>
</head>
<body>
<main>
  <h1 id="title">Einen Moment …</h1>
  <p id="text">Du wirst zu deinem Desk Buddy weitergeleitet.</p>
  <a id="link" class="btn" hidden>Weiter zum Desk Buddy</a>
</main>
<script>
  // Spotify schickt nach dem Login hierher zurück (?code=…&state=…).
  // Der state beginnt mit der IP des Desk Buddys im WLAN; diese Seite reicht
  // die Parameter nur dorthin weiter und speichert selbst nichts.
  const params = new URLSearchParams(location.search);
  const ip = (params.get("state") || "").split("_")[0];
  const local = /^(10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3})$/;

  if (local.test(ip)) {
    const target = "http://" + ip + "/callback" + location.search;
    const link = document.getElementById("link");
    link.href = target;
    location.replace(target);
    // Falls der Browser nicht von selbst weiterleitet
    setTimeout(() => {
      document.getElementById("title").textContent = "Fast fertig";
      document.getElementById("text").textContent =
        "Tippe auf den Button. Dein Handy muss im gleichen WLAN wie der Desk Buddy sein.";
      link.hidden = false;
    }, 2500);
  } else {
    document.getElementById("title").textContent = "Hier stimmt was nicht";
    document.getElementById("text").textContent =
      "Bitte starte die Verbindung über die Seite deines Desk Buddys neu.";
  }
</script>
</body>
</html>
